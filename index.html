<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Templo del Gong</title>
  <meta name="description" content="El Templo del Gong — Tienda de Gongs, Cuencos Tibetanos, Conciertos y Formación">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #1a1a2e;
      color: #d4c9b3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 680px;
      text-align: center;
    }
    .gong-symbol {
      font-size: 6rem;
      line-height: 1;
      margin-bottom: 1rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      color: #c9b88c;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: #a89a7d;
    }
    .status {
      display: inline-block;
      padding: 0.6rem 1.8rem;
      border: 1px solid #4a3f2e;
      border-radius: 40px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #b8a77d;
      background: #2a2535;
      margin-top: 2rem;
    }
    hr {
      border: none;
      border-top: 1px solid #3a3040;
      margin: 2rem 0 1.5rem;
      opacity: 0.3;
    }
    .footer {
      font-size: 0.75rem;
      color: #6b5f4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="gong-symbol">&#x1F501;</div>
    <h1>El Templo del Gong</h1>
    <p>Estamos trasladando el templo a un nuevo espacio.<br>
    Muy pronto volveremos a sonar con m&aacute;s fuerza.</p>
    <p>Gongs, cuencos tibetanos, conciertos y formaci&oacute;n —<br>
    todo lo que era el Templo encontrar&aacute; su nuevo hogar aqu&iacute;.</p>
    <div class="status">En migraci&oacute;n</div>
    <hr>
    <div class="footer">
      El Templo del Gong &mdash; Diego Montenegro
    </div>
  </div>
</body>
</html>
